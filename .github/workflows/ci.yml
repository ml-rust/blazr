# CI: format, lint, tests on three platforms, the MSRV, and the dependency
# audit. The CUDA code compiles in release.yml's linux-x64-cuda build, which
# gates the publish: numr's and boostr's kernels take too long to build on
# every push.
#
# Called by release.yml as its gate, so a tag runs the same checks as a PR.
#
# Every third-party action is pinned to a commit SHA, with its release in a
# trailing comment. A tag can move. A SHA cannot, so a retagged action cannot
# enter a run that holds a crates.io token.
#
# No job runs with `--locked`. Between releases the committed Cargo.lock can
# resolve boostr, numr, splintr and voxr through local path patches, which no
# runner has. Cargo resolves from crates.io here. release.yml is the one place
# that requires a crates.io lockfile.
#
# Tests that need a model directory or the motion-video skill's JavaScript
# skip with a notice when their env var is unset. None is set here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out; empty means the event's ref"
        required: false
        type: string
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  fmt:
    name: Format
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # ─────────────────────────────────────────────────────────────────────────
  # Default features first, so a `cfg(feature = "audio")` gap fails here.
  clippy:
    name: Clippy (${{ matrix.features || 'default features' }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "audio"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: clippy-${{ matrix.features || 'default' }}

      - name: Clippy
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo clippy --all-targets --features "$FEATURES" -- -D warnings

  # ─────────────────────────────────────────────────────────────────────────
  # `--no-fail-fast`: one failing test binary must not hide the next one.
  test:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: test

      - name: Run tests (audio)
        run: cargo test --features audio --no-fail-fast

  # ─────────────────────────────────────────────────────────────────────────
  # The MSRV comes from `package.rust-version`, so the published contract and
  # this job cannot drift apart. It is read with grep: the toolchain
  # `cargo metadata` runs on is the one this job is choosing.
  msrv:
    name: MSRV
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          MSRV=$(grep -m1 '^rust-version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [[ -z "$MSRV" ]]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "Declared MSRV: $MSRV"
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: msrv-${{ steps.msrv.outputs.version }}

      # Library and binary only. Dev-dependencies are not part of the
      # contract.
      - name: Check MSRV (audio)
        run: cargo check --features audio

  # ─────────────────────────────────────────────────────────────────────────
  # `--exclude-dev`: dev-dependencies link tests only, which no user runs.
  audit:
    name: Dependency audit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny --exclude-dev check
