# Release: a pushed `v*` tag, or a manual dispatch naming one.
#
# Stages:
#   validate        -> the tag matches Cargo.toml, CHANGELOG.md has its
#                      section, and Cargo.lock resolves from crates.io
#   ci              -> ci.yml, the same checks a PR runs
#   build           -> one archive per platform, `--locked`
#   publish-crate   -> crates.io, after every archive built
#   github-release  -> the archives, SHA256SUMS, and the changelog section
#
# Archive names carry no version, so
# `releases/latest/download/blazr-<label>.tar.gz` stays stable across
# releases.
#
# Each stage is idempotent. An already-indexed crate version is skipped, and
# the GitHub Release is updated in place. A dispatch can turn either final
# stage off, to retry the other one alone.
#
# The release commit's Cargo.lock must resolve every dependency from
# crates.io. A lockfile written through local path patches fails `validate`.
#
# Required secret: CARGO_REGISTRY_TOKEN (environment `crates-io`).

name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        type: string
      publish_crate:
        description: "Publish blazr to crates.io"
        type: boolean
        default: true
      github_release:
        description: "Create or update the GitHub Release"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ── Validate ────────────────────────────────────────────────────────────────
  validate:
    name: Validate tag, changelog and lockfile
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
      is_full_release: ${{ steps.version.outputs.is_full_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      # The tag must equal the committed version exactly. The build uses
      # `--locked`, so a version stamped at release time no longer
      # matches Cargo.lock.
      - name: Validate tag against Cargo.toml
        id: version
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name == "blazr") | .version')

          echo "Tag version:        $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"

          if [[ ! "$TAG_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-[a-zA-Z]+\.[0-9]+)?$ ]]; then
            echo "::error::Invalid tag format '$TAG'. Expected: vX.Y.Z or vX.Y.Z-label.N"
            exit 1
          fi
          BASE="${BASH_REMATCH[1]}"

          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error::Tag '$TAG_VERSION' != Cargo.toml '$CARGO_VERSION'. Commit the version first."
            exit 1
          fi

          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "is_full_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_full_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE" >> "$GITHUB_OUTPUT"

      # A prerelease is checked against its base version, so every candidate
      # rehearses the notes the final release carries.
      - name: Require a changelog section
        run: bash scripts/ci/changelog_section.sh "${{ steps.version.outputs.base_version }}"

      # `--locked` fails when Cargo.lock needs any change to resolve without
      # the local path patches, which this runner does not have.
      - name: Require a crates.io lockfile
        run: |
          set -euo pipefail
          if ! cargo metadata --locked --format-version=1 --features audio,cuda > /dev/null; then
            echo "::error::Cargo.lock does not resolve from crates.io. Regenerate it without .cargo/config.toml patches and commit it."
            exit 1
          fi

  # ── CI gate ─────────────────────────────────────────────────────────────────
  ci:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  # ── Third-party files ───────────────────────────────────────────────────────
  # One set for every archive, from the CUDA build's crate graph: the widest
  # one, so no archive carries fewer licences than it compiles in.
  third-party:
    name: Third-party licences
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli

      - name: Write licences and notices
        run: bash scripts/ci/third_party.sh audio,cuda third-party

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party
          path: third-party/*
          if-no-files-found: error
          retention-days: 3

  # ── Binaries ────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.label }})
    needs: [validate, ci, third-party]
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            features: audio
          - label: linux-x64-cuda
            runs-on: ubuntu-22.04
            container: nvidia/cuda:12.8.1-devel-ubuntu22.04
            target: x86_64-unknown-linux-gnu
            features: audio,cuda
          - label: linux-arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: audio
          - label: macos-arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
            features: audio
          - label: windows-x64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            features: audio
    env:
      # Every SASS arch, so the CUDA binary runs on GPUs other than the
      # (absent) build machine's. Ignored without `cuda`.
      NUMR_CUDA_ARCH: all
    steps:
      - name: Install build tools (CUDA container)
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: release-${{ matrix.label }}

      - name: Build release binary
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --features "$FEATURES" --target "$TARGET"

      - name: Download third-party files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party
          path: third-party

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist stage
          cp "target/$TARGET/release/blazr" LICENSE README.md stage/
          cp third-party/* stage/
          chmod +x stage/blazr
          tar -C stage -czf "dist/blazr-$LABEL.tar.gz" \
            blazr LICENSE README.md NOTICE LICENSE-LLAMA THIRD-PARTY-LICENSES.txt
          ls -l dist

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LABEL: ${{ matrix.label }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path dist, stage | Out-Null
          Copy-Item "target/$env:TARGET/release/blazr.exe", LICENSE, README.md -Destination stage
          Copy-Item third-party/* -Destination stage
          Compress-Archive -Path stage/* -DestinationPath "dist/blazr-$env:LABEL.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blazr-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # ── crates.io ───────────────────────────────────────────────────────────────
  # After every archive built, so a tag that cannot build never reaches
  # crates.io. A verifying publish (no `--no-verify`) builds the packaged
  # crate from a clean directory.
  publish-crate:
    name: Publish to crates.io
    needs: [validate, build]
    if: github.event_name == 'push' || inputs.publish_crate
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Publish blazr
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          if curl -sf -H "User-Agent: blazr-ci (github.com/ml-rust/blazr)" \
            "https://crates.io/api/v1/crates/blazr/$VERSION" > /dev/null 2>&1; then
            echo "blazr@$VERSION already published — skipping"
            exit 0
          fi
          echo "Publishing blazr@$VERSION..."
          cargo publish --locked

  # ── GitHub Release ──────────────────────────────────────────────────────────
  # Independent of publish-crate: a crates.io outage does not block the
  # binaries, and re-running this stage alone fixes a bad release body.
  github-release:
    name: Create GitHub Release
    needs: [validate, build]
    if: github.event_name == 'push' || inputs.github_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blazr-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum blazr-* > SHA256SUMS
          cat SHA256SUMS

      # The changelog is the release notes. `validate` has already proved the
      # section exists and is non-empty.
      - name: Build release notes from the changelog
        env:
          BASE: ${{ needs.validate.outputs.base_version }}
        run: |
          set -euo pipefail
          # `-l` is required: `git tag` with a pattern but no list flag is the
          # create form, which errors out and leaves the compare link missing.
          PREVIOUS_TAG=$(git tag -l --sort=-v:refname 'v*' | grep -v "^${TAG}$" | head -n 1 || true)

          bash scripts/ci/changelog_section.sh "$BASE" "$RUNNER_TEMP/changelog-section.md"

          {
            cat "$RUNNER_TEMP/changelog-section.md"
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "**Full diff:** https://github.com/ml-rust/blazr/compare/${PREVIOUS_TAG}...${TAG}"
            else
              echo "**Tree:** https://github.com/ml-rust/blazr/tree/${TAG}"
            fi
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: blazr ${{ needs.validate.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: ${{ needs.validate.outputs.is_full_release != 'true' }}
          make_latest: ${{ needs.validate.outputs.is_full_release == 'true' }}
          files: |
            dist/blazr-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true
