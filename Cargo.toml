[package]
name = "blazr"
version = "0.4.0"
edition = "2021"
rust-version = "1.95"
authors = ["Farhan Syah"]
description = "LLM inference server with an OpenAI-compatible API, plus speech synthesis (TTS) and transcription (ASR). Serves Llama, Mistral, Qwen, Mamba2, MLA+MoE and hybrid models from SafeTensors, AWQ, GPTQ and GGUF."
license = "Apache-2.0"
repository = "https://github.com/ml-rust/blazr"
homepage = "https://github.com/ml-rust/blazr"
keywords = ["inference", "llm", "server", "openai", "gguf"]
categories = [
  "science",
  "web-programming",
  "multimedia::audio",
  "command-line-utilities",
]
# Release tooling stays in the repository, out of the crate.
exclude = [".github/", "scripts/", "deny.toml", "about.toml", "about.hbs", ".cargo/"]

[features]
default = ["f16", "cli", "server"]
f16 = ["boostr/f16"]
cuda = ["boostr/cuda", "voxr-narrate?/cuda"]
# WebGPU runtime: Metal (Apple), Vulkan (Android, Linux, AMD, Intel, NVIDIA),
# DX12 (Windows) and the browser. With `cuda` also on, CUDA wins.
wgpu = ["boostr/wgpu"]
nccl = ["boostr/nccl"]
distributed = ["boostr/distributed", "dep:nexar"]

# Hugging Face hub client: `blazr pull`, the server's `/api/pull`, and the
# first-use model download of the audio commands. Network only.
hub = ["dep:hf-hub", "dep:indicatif"]

# The command-line front end: argument parsing, the REPL, progress output
# and log setup. `run`, `chat`, `bench`, `info`, `list`, `convert` and `pull`
# need only the engine and the hub client.
cli = [
  "hub",
  "dep:clap",
  "dep:clap_complete",
  "dep:colored",
  "dep:rustyline",
  "dep:tracing-subscriber",
]

# The HTTP front end: the OpenAI, Anthropic and Ollama routes, TLS, the
# Prometheus exporter, remote image fetching, `blazr serve` and `blazr ps`.
# Without it the library is the engine alone, for phone, browser and
# embedded hosts.
server = [
  "hub",
  "tokio/full",
  "dep:axum",
  "dep:tower-http",
  "dep:hyper-util",
  "dep:rustls",
  "dep:tokio-rustls",
  "dep:reqwest",
  "dep:metrics-exporter-prometheus",
  "dep:tokio-stream",
]

# Speech: text-to-speech synthesis and audio transcription endpoints, the
# `speak`, `transcribe` and `sound-review` commands, plus the TTS, Whisper
# and CLAP loaders they need.
# Off by default — a text-only inference server has no use for the audio
# pipelines or their four codec decoders. The Whisper weights and mel front
# end come from boostr; the bundle (tokenizer, generation config) and the TTS
# engines come from voxr; the narration logic comes from voxr-narrate.
# The routes need `server` and the commands need `cli`.
audio = [
  "server",
  "cli",
  "dep:voxr",
  "voxr/kokoro",
  "voxr/voxcpm",
  "voxr/vits",
  "voxr/whisper",
  "voxr/clap",
  "boostr/whisper",
  "dep:voxr-narrate",
  "voxr-narrate/whisper",
  "voxr-narrate/kokoro",
  "voxr-narrate/vits",
  "voxr-narrate/voxcpm",
  "voxr-narrate/stretch",
]

# C ABI for app embedders: `src/capi`, header `include/blazr.h`. The engine
# alone: it needs neither `server` nor `cli`.
capi = []

# `staticlib` and `cdylib` carry the C ABI for iOS, Android and desktop apps.
[lib]
crate-type = ["lib", "staticlib", "cdylib"]

# The binary is the CLI with the server: `serve` is one of its commands.
[[bin]]
name = "blazr"
path = "src/main.rs"
required-features = ["cli", "server"]

[dependencies]
# ML framework (model architectures, quant kernels, tensors via numr)
boostr = { version = "0.9" }
# Sample-level audio: codecs, resampling, WAV encoding, TTS engines.
voxr = { version = "0.7", optional = true }
# Narration: `speak` and `transcribe`, the take loop, the speech check and
# every line, file and exit code they hold.
voxr-narrate = { version = "0.7", optional = true }

# Tokenization
splintr = { version = "0.22", features = [
  "vocab-cl100k",
  "vocab-o200k",
  "vocab-llama3",
  "vocab-deepseek",
  "vocab-mistral",
] }

# Async runtime. The engine needs channels, locks, timers and task yield.
# `server` adds the rest of tokio.
tokio = { version = "1", features = ["sync", "time", "rt"] }

# HTTP server (`server`)
axum = { version = "0.8", features = ["multipart"], optional = true }
tower-http = { version = "0.7", optional = true, features = [
  "cors",
  "trace",
  "timeout",
  "limit",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a tool schema rendered into a chat prompt keeps the key
# order the client sent, the order the model saw in training.
# `float_roundtrip`: a float parses to the nearest double, as Python's
# `json.loads` does, so a decision state re-serialized into a prompt spells
# every number the way the reference renderer does.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde-saphyr = "1.3"

# Chat templates: the model's own Jinja template, rendered with the Python
# behaviours Hugging Face templates rely on.
minijinja = { version = "3.0", default-features = false, features = [
  "builtins",
  "macros",
  "adjacent_loop_items",
  "loop_controls",
  "json",
  "serde",
  "std_collections",
  "preserve_order",
] }
minijinja-contrib = { version = "3.0", default-features = false, features = [
  "pycompat",
] }

# CLI (`cli`)
clap = { version = "4", features = ["derive", "env"], optional = true }
clap_complete = { version = "4", optional = true }

# Byte casting for tensor creation from raw bytes
bytemuck = "1"
half = "2"

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
glob = "0.3"
# The chat template hash a decision model's prompt contract pins. Pure
# Rust: builds for wasm32 and Android.
sha2 = { version = "0.11", default-features = false }

# HuggingFace Hub for model downloading (`hub`)
# Blocking API plus the async client, over reqwest with rustls: no system
# OpenSSL.
hf-hub = { version = "1.0", default-features = false, features = ["blocking"], optional = true }

# Distributed runtime (swarm mode)
nexar = { version = "0.1.2", optional = true }

# Async streaming
futures = "0.3"
async-stream = "0.3"
tokio-stream = { version = "0.1", optional = true }

# Random number generation
rand = "0.10"

# Metrics. The engine records through the `metrics` facade. The
# Prometheus exporter belongs to `server`.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, optional = true, features = [
  "http-listener",
] }

# CLI UX (`cli`, `hub`)
colored = { version = "3", optional = true }
indicatif = { version = "0.18", optional = true }
dirs = "7"
rustyline = { version = "18", optional = true }

# HTTP client (`server`): `blazr ps` and remote image URLs.
# rustls without a provider of its own: it reads the ring default the
# process installs, see `crate::tls`.
reqwest = { version = "0.13", default-features = false, optional = true, features = [
  "json",
  "rustls-no-provider",
  "charset",
  "http2",
  "system-proxy",
] }


# TLS support. ring is the process-wide crypto provider, installed at
# start. hf-hub's reqwest also links aws-lc-rs, and with two linked
# providers `rustls::*Config::builder()` panics unless one is installed.
rustls = { version = "0.23", default-features = false, optional = true, features = [
  "ring",
  "logging",
  "std",
  "tls12",
] }
tokio-rustls = { version = "0.26", default-features = false, optional = true, features = [
  "ring",
  "logging",
  "tls12",
] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"], optional = true }

# Browser builds: the engine's sampling and request ids read randomness from
# the JavaScript host.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
# `#[tokio::test]` in a build without `server`.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Per-thread test recorder for the engine's metrics tests.
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# Scratch directories for the narration command tests.
tempfile = "3"
# `ServiceExt::oneshot`, for driving the axum router in-process against a
# built request instead of a live socket (server route integration tests).
tower = { version = "0.5", features = ["util"] }

# The C ABI tests need the `capi` feature.
[[test]]
name = "capi_generate"
required-features = ["capi"]

[[test]]
name = "capi_smoke_c"
required-features = ["capi"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
