# cbindgen config for include/blazr.h. Regenerate with:
#   cbindgen --config cbindgen.toml --output include/blazr.h src/capi/mod.rs
# `tests/capi_header.rs` fails when the header and src/capi disagree.
language = "C"
include_guard = "BLAZR_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
autogen_warning = "/* Generated by cbindgen from src/capi. Do not edit. See cbindgen.toml. */"
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true

[parse]
parse_deps = false

[export]
item_types = ["enums", "structs", "typedefs", "opaque", "functions"]
include = ["BlazrStatus", "BlazrLoadOptions", "BlazrGenerateParams", "BlazrTokenCallback"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
